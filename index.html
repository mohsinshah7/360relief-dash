<!DOCTYPE html><html><head><meta charset="utf-8"><title>360 Relief — Amazon PPC</title></head><body style="background:#0b1220;color:#dbe4f0;font-family:system-ui"><div id="s" style="padding:40px;text-align:center">Loading secure dashboard…</div>
<script>
(async()=>{const n=32,v='1786481152';let bufs=[];try{for(let i=0;i<n;i++){document.getElementById('s').textContent='Loading secure dashboard… '+Math.round(i*100/n)+'%';const r=await fetch('parts/p'+String(i).padStart(2,'0')+'?v='+v);if(!r.ok)throw new Error('part '+i);bufs.push(await r.arrayBuffer());}const blob=new Blob(bufs,{type:'text/html'});const html=await blob.text();document.open();document.write(html);document.close();}catch(e){document.getElementById('s').textContent='Load failed: '+e.message+' — refresh to retry.';}})();
</script></body></html>
